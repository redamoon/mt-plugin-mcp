name: MT MCP Server
id: MTMCP
key: MTMCP
version: 0.1.0
schema_version: 0.1
description: Movable Type 9 用 MCP (Model Context Protocol) サーバープラグイン

author_name: ''
author_link: ''

config_template: cfg_plugin.tmpl

applications:
  cms:
    methods:
      mcp_token:     $MTMCP::MTMCP::CMS::Token::show
      gen_mcp_token: $MTMCP::MTMCP::CMS::Token::generate

  data_api:
    endpoints:
      - id: mcp
        route: /mcp
        version: 4
        verb: POST
        handler: $MTMCP::MTMCP::App::handle
        requires_login: 0
      - id: mcp_sse
        route: /mcp
        version: 4
        verb: GET
        handler: $MTMCP::MTMCP::App::handle_sse
        requires_login: 0
      - id: mcp_options
        route: /mcp
        version: 4
        verb: OPTIONS
        handler: $MTMCP::MTMCP::App::handle_options
        requires_login: 0
