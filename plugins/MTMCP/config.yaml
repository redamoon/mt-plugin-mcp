name: MT MCP Server
id: MTMCP
key: MTMCP
version: 0.1.0
schema_version: 0.1
description: Movable Type 9 用 MCP (Model Context Protocol) サーバープラグイン

author_name: ''
author_link: ''

config_template: cfg_plugin.tmpl

settings:
  api_token:
    default: ''
    scope: system

applications:
  data_api:
    endpoints:
      - id: mcp
        route: /mcp
        version: 4
        verb: POST
        handler: $MTMCP::MTMCP::App::handle
        requires_login: 0
